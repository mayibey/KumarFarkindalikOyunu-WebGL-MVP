<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanal Kumar Bagımlılığı · Sunum</title>
<style>
  html,body{margin:0;height:100%;background:#0B0A09;overflow:hidden}
  #sahne{position:fixed;left:50%;top:50%;width:1920px;height:1080px;border:0;background:#0B0A09;transform-origin:center center}
</style>
</head>
<body>
<script>
  var hedef = "sunum.html" + location.search + location.hash;
  if(!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
    location.replace(hedef); // masaustu: dogrudan deste
  } else {
    document.write('<iframe id="sahne" src="'+hedef+'" allow="autoplay; fullscreen"><\/iframe>');
    var olcekle = function(){
      var f = document.getElementById("sahne");
      if(!f) return;
      var k = Math.min(window.innerWidth/1920, window.innerHeight/1080);
      f.style.transform = "translate(-50%,-50%) scale(" + k + ")";
    };
    window.addEventListener("resize", olcekle);
    window.addEventListener("orientationchange", olcekle);
    olcekle(); setTimeout(olcekle, 200);
  }
</script>
</body>
</html>
